components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wb_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          example: REVISION_CONFLICT
        message:
          type: string
        requestId:
          type: string
          format: uuid
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - login
        - displayName
        - status
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
            - active
            - disabled
    Credentials:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^[A-Za-z0-9@._+-]+$
          description: Trimmed and lowercased; stable login identifier, not necessarily email.
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    Register:
      type: object
      additionalProperties: false
      required:
        - login
        - password
        - displayName
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^[A-Za-z0-9@._+-]+$
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    Csrf:
      type: object
      additionalProperties: false
      required:
        - csrfToken
        - expiresAt
      properties:
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    Config:
      type: object
      additionalProperties: false
      required:
        - registrationEnabled
        - language
        - maxVocabularyEntries
        - maxInputCodePoints
        - maxInputBytes
        - maxArticles
      properties:
        registrationEnabled:
          type: boolean
        language:
          type: string
          enum:
            - ja-JP
        maxVocabularyEntries:
          type: integer
          minimum: 1
        maxInputCodePoints:
          type: integer
          minimum: 1
        maxInputBytes:
          type: integer
          minimum: 1
        maxArticles:
          type: integer
          minimum: 1
          default: 100
          description: Maximum saved articles per account. Deployment MAX_ARTICLES defaults to 100; creation and
            capacity checks are atomic. Deletion releases a slot.
    VocabularyInput:
      type: object
      additionalProperties: false
      required:
        - text
        - reading
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
    VocabularyPatch:
      type: object
      additionalProperties: false
      required:
        - text
        - reading
        - expectedRevision
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        expectedRevision:
          type: integer
          minimum: 1
    Vocabulary:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - reading
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VocabularyResult:
      type: object
      additionalProperties: false
      required:
        - entry
        - internalVersion
      properties:
        entry:
          $ref: "#/components/schemas/Vocabulary"
        internalVersion:
          type: integer
          minimum: 0
    VocabularyPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - offset
        - limit
        - internalVersion
      properties:
        items:
          type: array
          items:
