  /v1/audio/speech:
    post:
      operationId: synthesizeSpeech
      summary: Synthesize Japanese article with personal rules
      description: Plain text only, must contain non-whitespace; reject U+0000–U+0008, U+000B–U+001F and
        U+007F–U+009F (tab and LF allowed). Rules are NFC-normalized at save, but article input is never
        normalized or rewritten. Match saved rules against original input using case-sensitive literal
        matching, leftmost then longest match, ties by stable createdAt/id rule order, single pass with no
        recursive replacement. Read one immutable snapshot before the provider call; subsequent writes cannot
        alter it. At most 10000 Unicode code points AND 49152 UTF-8 bytes, JSON body at most 65536 bytes.
        Server selects owned rules from authenticated identity; actor/owner/dictionaryIds/SSML/positions are
        rejected. One immutable personal snapshot per request; no persisted article/audio. Saving while
        synthesis is in flight does not change its snapshot. Unconfigured TTS returns 503, unknown voice 400.
        No automatic billable retries.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Speech"
      responses:
        "200":
          description: Complete MP3, max 8388608 bytes; buffered before headers. No JSON envelope or automatic retry.
            Browser must consume complete response before playback.
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="speech.mp3"
            X-Pronunciation-Version:
              schema:
                type: integer
                minimum: 0
              description: Version of the personal snapshot actually used for this response, never a later DB lookup.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: "INVALID_REQUEST: invalid fields, JSON or unknown properties"
          headers:
            X-Request-Id:
