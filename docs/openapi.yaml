        externalId:
          type: string
          minLength: 1
          maxLength: 200
        articleId:
          type: string
          format: uuid
          nullable: true
        expectedRevision:
          type: integer
          minimum: 0
        expectedCmsRevision:
          type: integer
          minimum: 0
    CmsImportPreviewInput:
