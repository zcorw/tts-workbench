          required:
            - audioId
            - contentRevision
            - ruleVersion
            - voice
            - speed
            - language
            - format
            - mimeType
            - byteLength
            - characterCount
            - filename
            - createdAt
          properties:
            audioId:
              type: string
              format: uuid
            contentRevision:
              type: integer
              minimum: 1
            ruleVersion:
              type: integer
              minimum: 0
            voice:
              type: string
              minLength: 1
              description: Public voice alias actually used; never a credential or private provider configuration.
            speed:
              type: number
              minimum: 0.5
              maximum: 2
              multipleOf: 0.01
              default: 1
            language:
              type: string
              enum:
                - ja-JP
            format:
              type: string
              enum:
                - mp3
            mimeType:
              type: string
              enum:
                - audio/mpeg
            byteLength:
              type: integer
              minimum: 1
              maximum: 8388608
            characterCount:
              type: integer
              minimum: 1
              maximum: 10000
            filename:
              type: string
              description: Safe download filename, also supplied through Content-Disposition.
            createdAt:
              type: string
              format: date-time
          description: Only the last successfully committed audio is retained. contentRevision and ruleVersion identify
            the saved text and immutable personal snapshot actually synthesized. An audioId identifies exactly
            one set of bytes; replacement removes the previous ID. No history endpoint.
          nullable: true
        audioStale:
          type: boolean
          description: False without audio. Otherwise true if audio.contentRevision differs from current contentRevision
            or audio.ruleVersion differs from currentRuleVersion. Client also marks stale against unsaved text
            and selected voice/speed. Title-only edits do not stale audio.
        text:
          type: string
          maxLength: 10000
          description: Original text, never trimmed, normalized or rewritten. 0–10000 Unicode code points AND at most
