      summary: Generate and atomically retain last successful article audio
      description: "F2: synthesize only server-loaded saved original text, never client-supplied
        input/owner/dictionaryIds/SSML. Client must save first; blank saved text is400 INVALID_REQUEST. Check
        owner and expectedRevision before any provider call and allocate monotonic per-article generationSeq
        in a short transaction. Call existing Japanese Gateway outside DB transaction using one immutable
        personal-rule snapshot. Shared billable rate-limit pool with /v1/audio/speech and /v1/audio/preview,
        same CSRF/Origin/voice permissions and cancellation; never automatically retry. Buffer complete valid
        MP3 <=8388608 bytes before commit. Commit transaction locks existing article, rechecks active
        account/ownership, contentRevision and stored successful generationSeq. Deleted/not-owned returns404.
        Changed content returns409 ARTICLE_CONTENT_CHANGED, including changed-then-reverted text; title-only
        edits after admission are allowed. If newer-started generation already succeeded, discard older result
        with409 AUDIO_SUPERSEDED. If newer generation failed/pending, older success may commit and newer
        success may replace it later. Replace bytes and metadata atomically, assign fresh audioId; no prior
        audio row retained. Failure/cancellation/DB failure never clears previous audio; cancellation cannot
        undo a commit that already happened. Rule changes in flight do not rewrite the actual snapshot: commit
        the result with actual ruleVersion and audioStale based on current version. Return JSON metadata only
        after persistence. A successful commit followed by lost HTTP response is recovered through getArticle,
        never automatic re-synthesis. Article editing revision/updatedAt are unchanged by generation."
