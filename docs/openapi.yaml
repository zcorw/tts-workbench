openapi: 3.0.3
info:
  title: Japanese TTS Workbench API
  version: 1.4.0
  description: "Same-origin browser API. All schemas reject unknown fields and null unless explicitly nullable.
    CMS publications remain private to their owner or a narrowly scoped read credential; no anonymous content
    access. All responses include X-Request-Id and Cache-Control: no-store. Public host Nginx terminates
    HTTPS, proxies a single 127.0.0.1 Compose port. Do not trust caller-supplied identity or forwarded
    headers. Fetch with credentials same-origin. Every mutation uses JSON (except bodyless logout/delete),
    Origin verification and X-CSRF-Token; registration and CMS read-token issuance are opt-in. No
    local-position override."
servers:
  - url: /
paths:
  /v1/config:
    get:
      operationId: getConfig
      summary: Public UI capabilities
      description: ""
      security: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "400":
          description: "INVALID_REQUEST: invalid fields, JSON or unknown properties"
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN / CSRF_INVALID / REGISTRATION_DISABLED
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED; retry after indicated seconds
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE / TTS_UNAVAILABLE
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Get browser-bound CSRF token
      description: "Sets HttpOnly csrf binding cookie (Path=/, SameSite=Lax, Secure in production). Token valid for
        1 hour; repeated calls reuse binding. Send returned token in X-CSRF-Token for every POST/PATCH/DELETE
        including anonymous login/register. Login/logout invalidate binding: fetch again after success. GET
        accepts a missing Origin (normal same-origin browser GET); when present it must equal configured
        public origin. Strict required Origin applies only to POST/PATCH/DELETE."
      security: []
      responses:
        "200":
          description: Success
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Csrf"
        "400":
