  /v1/cms/articles/move-category:
    post:
      operationId: cmsMoveArticleCategory
      summary: Move owned articles to one category atomically
      description: 1–100 unique owned article IDs. Validate target category and every article expectedRevision/CMS
        expectedCmsRevision before any update. Any missing/not-owned/stale item rolls back the entire batch
        (404 NOT_FOUND, 409 REVISION_CONFLICT/CMS_REVISION_CONFLICT); invalid target is400 INVALID_REQUEST.
        Changes only working CMS category and increments CMS revision only when needed. Preserves original
        revision/contentRevision/updatedAt, text, audio metadata/bytes, tags, summary, slug and publication
        pointer/snapshot. No TTS. Same-category moves are no-op. A metadata-less article moved to null remains
        revision0; moving it into a category creates safe unique CMS slug/empty summary/tags at revision1
        without rewriting original content. Read-token/frozen release scopes do not change.
