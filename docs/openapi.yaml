            - created
            - error
            - pending
        articleId:
          type: string
          format: uuid
        slug:
          type: string
        revision:
          type: integer
        cmsRevision:
          type: integer
        code:
          type: string
        retryable:
          type: boolean
        editUrl:
          type: string
          format: uri
      required:
        - requestId
        - status
    McpBatchResult:
      type: object
      additionalProperties: false
      properties:
        batchId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpItemResult"
        created:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
      required:
        - batchId
        - items
        - created
        - failed
        - pending
    McpTokenRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
        client_id:
          type: string
        resource:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
      required:
        - grant_type
        - client_id
        - resource
    McpTokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          maximum: 900
        scope:
          type: string
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - scope
    McpOAuthError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error
    McpRpcRequest:
      type: object
      additionalProperties: false
      properties:
        jsonrpc:
          type: string
          enum:
            - "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
        params:
          type: object
          additionalProperties: true
      required:
        - jsonrpc
        - method
    McpRpcResponse:
      type: object
      additionalProperties: true
      description: SDK JSON-RPC response. tools/call returns content and structuredContent; domain failures set
        isError. Tool arguments and annotations are discovered through tools/list. Batch receipts use
        McpBatchResult.
    ZhiyueDeviceAuthorization:
      type: object
      additionalProperties: false
      properties:
        device_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Secret polling code. Keep private.
        user_code:
          type: string
          pattern: ^[23456789ABCDEFGHJKMNPQRSTVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTVWXYZ]{4}$
        verification_uri:
          type: string
          format: uri
          description: HTTPS browser approval page on the configured CMS origin.
        expires_in:
          type: integer
          enum:
            - 300
          description: Device request lifetime in seconds.
        interval:
          type: integer
          enum:
            - 5
          description: Minimum polling interval in seconds.
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
    ZhiyueDeviceClaim:
      type: object
      additionalProperties: false
      properties:
        device_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
      required:
        - device_code
    ZhiyueDeviceBinding:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Revocable device credential returned only on successful claim. Never log or include it in URLs.
        expires_in:
          type: integer
          enum:
            - 86400
          description: Binding lifetime in seconds (24 hours). No refresh credential.
        account:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
          required:
            - id
            - displayName
        binding_id:
          type: string
          format: uuid
      required:
        - access_token
        - expires_in
        - account
        - binding_id
    ZhiyueDeviceApproval:
      type: object
      additionalProperties: false
      properties:
        user_code:
          type: string
          maxLength: 24
          description: Eight alphanumeric characters after removing whitespace and hyphens. Case insensitive.
        expected_account_id:
          type: string
          format: uuid
          description: Must equal the current signed-in account, otherwise 409 ACCOUNT_CHANGED.
      required:
        - user_code
        - expected_account_id
    ZhiyueBindings:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
            required:
              - id
              - createdAt
              - expiresAt
      required:
        - items
    ZhiyueArticleItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Article ID, stable across replacement of the current publication.
        title:
          type: string
          maxLength: 120
        publishedAt:
          type: string
          format: date-time
        hasAudio:
          type: boolean
      required:
        - id
        - title
        - publishedAt
        - hasAudio
    ZhiyueArticlePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ZhiyueArticleItem"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 20
        offset:
          type: integer
          minimum: 0
      required:
        - items
        - total
        - limit
        - offset
    ZhiyueArticle:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Article ID, stable across replacement of the current publication.
        title:
          type: string
          maxLength: 120
        publishedAt:
          type: string
          format: date-time
        hasAudio:
          type: boolean
        releaseId:
          type: string
          format: uuid
          description: Current publication ID, used for the audio-ticket request.
        text:
          type: string
          maxLength: 10000
          description: Exact published text, at most 49152 UTF-8 bytes.
      required:
        - id
        - title
        - publishedAt
        - hasAudio
        - releaseId
        - text
    ZhiyueAudioTicket:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Private, short-lived URL for this publication only. Never persist or log it.
        expires_in:
          type: integer
          minimum: 1
          maximum: 150
          description: Seconds remaining, capped by the binding expiration.
      required:
        - url
        - expires_in
    ZhiyueGrantError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - invalid_grant
            - expired_token
            - authorization_pending
            - slow_down
            - invalid_token
            - invalid_request
            - temporarily_unavailable
      required:
        - error
    ZhiyueRateLimitError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - slow_down
        code:
          type: string
          enum:
            - RATE_LIMITED
        message:
          type: string
          enum:
            - RATE_LIMITED
      required:
        - error
        - code
        - message
