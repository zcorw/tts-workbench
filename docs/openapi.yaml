        "503":
          description: DEPENDENCY_UNAVAILABLE / TTS_UNAVAILABLE
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
