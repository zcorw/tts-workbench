            49152 UTF-8 bytes. Empty/whitespace drafts may be saved. Reject U+0000–U+0008, U+000B–U+001F and
            U+007F–U+009F; tab and LF allowed. Synthesis separately requires non-whitespace.
    ArticlePatch:
      type: object
      additionalProperties: false
      required:
        - title
        - text
        - expectedRevision
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim before validation/storage; 1–120 Unicode code points. No unique-title constraint.
        text:
          type: string
          maxLength: 10000
          description: Original text, never trimmed, normalized or rewritten. 0–10000 Unicode code points AND at most
            49152 UTF-8 bytes. Empty/whitespace drafts may be saved. Reject U+0000–U+0008, U+000B–U+001F and
            U+007F–U+009F; tab and LF allowed. Synthesis separately requires non-whitespace.
        expectedRevision:
          type: integer
          minimum: 1
    ArticlePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSummary"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ArticleSynthesis:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - voice
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        voice:
          type: string
          minLength: 1
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          multipleOf: 0.01
          default: 1
    ArticleAudioResult:
      type: object
      additionalProperties: false
      required:
        - articleId
