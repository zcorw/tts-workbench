  /v1/zhiyue/account/approve:
    post:
      operationId: zhiyueApproveDevice
      summary: Approve 知阅 device pairing from the signed-in browser
      description: Requires CMS_ZHIYUE_ENABLED=true (default false), the CMS listener and a configured HTTPS CMS
        origin. Uses the current browser session; mutations require the matching Origin and X-CSRF-Token. The
