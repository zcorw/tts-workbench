        id:
          type: string
        name:
          type: string
        language:
          type: string
          enum:
            - ja-JP
        provider:
          type: string
          enum:
            - azure-speech
            - amazon-polly
    Voices:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Voice"
          description: Empty when no Japanese provider is configured; no demo voice is returned.
