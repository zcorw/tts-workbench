  /v1/zhiyue/media/{ticket}:
    get:
      operationId: zhiyueReadAudio
      summary: Play current published MP3 with a scoped media ticket
      description: Requires CMS_ZHIYUE_ENABLED=true (default false), the CMS listener and a configured HTTPS CMS
        origin. The private ticket in the path grants only this release audio and requires a live device
        binding and an active owner. A withdrawn or replaced publication is unavailable. Supports one byte
        range, including open-ended and suffix ranges. No device bearer or browser cookie is needed. Response
        is no-store. Do not log the ticket or the full request path.
      security: []
      parameters:
        - name: ticket
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{32,128}$
        - name: Range
          in: header
          schema:
            type: string
            example: bytes=0-1023
      responses:
        "200":
          description: Complete MP3.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Requested MP3 byte range.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
            Content-Range:
              schema:
                type: string
              description: HTTP Content-Range for this single range or the unsatisfied byte range.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request shape, input or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Ticket invalid, expired, or tied to an inactive or revoked binding.
          content:
            application/json:
              schema:
