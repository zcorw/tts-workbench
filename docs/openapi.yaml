openapi: 3.0.3
info:
  title: Japanese TTS Workbench API
  version: 1.6.0
  description: "Same-origin browser API. All schemas reject unknown fields and null unless explicitly nullable.
    CMS publications remain private to their owner or a narrowly scoped read credential; no anonymous content
    access. All responses include X-Request-Id and Cache-Control: no-store. Public host Nginx terminates
    HTTPS, proxies a single 127.0.0.1 Compose port. Do not trust caller-supplied identity or forwarded
    headers. Fetch with credentials same-origin. Every mutation uses JSON (except bodyless logout/delete),
    Origin verification and X-CSRF-Token; registration and CMS read-token issuance are opt-in. No
    local-position override. 知声 MCP is opt-in at the CMS origin /mcp, using dedicated OAuth
    authorization-code/PKCE grants, not browser cookies or existing read tokens. Browser consent/management
    still requires Session/Origin/CSRF. See docs/CMS_MCP.md for immutable batch IDs and operational
    boundaries. 知阅 device APIs are opt-in on the HTTPS CMS origin. Device requests use a dedicated binding
    token or a release-scoped media ticket, and bypass browser Session/Origin/CSRF. Browser pairing approval
    and binding management retain Session/Origin/CSRF."
servers:
  - url: /
paths:
  /v1/config:
    get:
      operationId: getConfig
      summary: Public UI capabilities
      description: ""
      security: []
      responses:
        "200":
