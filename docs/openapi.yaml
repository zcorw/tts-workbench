      description: Requires CMS_ZHIYUE_ENABLED=true (default false), the CMS listener and a configured HTTPS CMS
        origin. Uses the current browser session; mutations require the matching Origin and X-CSRF-Token.
        Lists only live bindings, newest first, with no credential plaintext.
      security:
        - sessionCookie: []
