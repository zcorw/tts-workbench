            original state. Never log the URL.
      required:
        - redirectUrl
    McpGrant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - clientId
        - scopes
        - createdAt
        - expiresAt
        - revokedAt
    McpGrantPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpGrant"
      required:
        - items
    McpDraftInput:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim before validation/storage; 1–120 Unicode code points. No unique-title constraint.
        text:
          type: string
          maxLength: 10000
          description: Original text, never trimmed, normalized or rewritten. 0–10000 Unicode code points AND at most
            49152 UTF-8 bytes. Empty/whitespace drafts may be saved. Reject U+0000–U+0008, U+000B–U+001F and
            U+007F–U+009F; tab and LF allowed. Synthesis separately requires non-whitespace.
        summary:
          type: string
          maxLength: 1000
        categoryId:
          type: string
          format: uuid
          nullable: true
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          uniqueItems: true
      required:
        - requestId
        - title
        - text
    McpBatchInput:
      type: object
      additionalProperties: false
      properties:
        batchId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpDraftInput"
          minItems: 1
          maxItems: 20
      required:
        - batchId
        - items
    McpItemResult:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        status:
