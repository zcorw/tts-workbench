      description: "F2: synthesize only server-loaded saved original text, never client-supplied
        input/owner/dictionaryIds/SSML. Client must save first; blank saved text is400 INVALID_REQUEST. Check
        owner and expectedRevision before any provider call and allocate monotonic per-article generationSeq
        in a short transaction. Call existing Japanese Gateway outside DB transaction using one immutable
        personal-rule snapshot. Shared billable rate-limit pool with /v1/audio/speech and /v1/audio/preview,
        same CSRF/Origin/voice permissions and cancellation; never automatically retry. Buffer complete valid
        MP3 <=8388608 bytes before commit. Commit transaction locks existing article, rechecks active
        account/ownership, contentRevision and stored successful generationSeq. Deleted/not-owned returns404.
