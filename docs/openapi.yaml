              type: integer
              minimum: 1
            ruleVersion:
              type: integer
              minimum: 0
            voice:
              type: string
              minLength: 1
              description: Public voice alias actually used; never a credential or private provider configuration.
            speed:
              type: number
              minimum: 0.5
              maximum: 2
              multipleOf: 0.01
              default: 1
            language:
              type: string
              enum:
                - ja-JP
            format:
              type: string
              enum:
                - mp3
            mimeType:
              type: string
              enum:
                - audio/mpeg
            byteLength:
              type: integer
              minimum: 1
              maximum: 8388608
            characterCount:
              type: integer
              minimum: 1
              maximum: 10000
            filename:
              type: string
              description: Safe download filename, also supplied through Content-Disposition.
            createdAt:
              type: string
              format: date-time
          description: Working article APIs retain the latest successful audio only. CMS releases separately retain
            selected immutable bytes, using the same actual content/rule/voice/speed metadata.
          nullable: true
    CmsReleasePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CmsRelease"
    CmsReadCategory:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - names
        - articleCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        names:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          minItems: 1
          uniqueItems: true
        articleCount:
          type: integer
          minimum: 1
      description: Direct frozen category membership among current authorized publications only. name/slug come from
        the newest current release by createdAt/id; names lists distinct current snapshot names newest first.
        No draft taxonomy, hierarchy or empty management category is exposed.
    CmsReadCategoryPage:
      type: object
      additionalProperties: false
      required:
        - categories
        - uncategorizedCount
        - totalArticles
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CmsReadCategory"
        uncategorizedCount:
          type: integer
          minimum: 0
        totalArticles:
          type: integer
          minimum: 0
      description: Counts sum to totalArticles within the same current-publication/read-credential scope. An
        uncategorized publication has a null frozen category. Nonempty leaf credential scopes never include
        uncategorized or descendants.
    CmsReadPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - offset
        - limit
        - navigation
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CmsRelease"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        navigation:
          $ref: "#/components/schemas/CmsReadCategoryPage"
      description: Items, filtered total and navigation are read in one REPEATABLE READ transaction. Navigation
        applies the same q/tag and authorization scope, but ignores category and pagination. A selected direct
        category count therefore matches total; navigation is stable across pages of the same snapshot.
    CmsPublish:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - expectedCmsRevision
        - expectedAudioId
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        expectedCmsRevision:
          type: integer
          minimum: 1
        expectedAudioId:
          type: string
          format: uuid
          nullable: true
    CmsUnpublish:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - expectedCmsRevision
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        expectedCmsRevision:
          type: integer
          minimum: 1
    CmsImportItem:
      type: object
      additionalProperties: false
      required:
        - externalId
        - title
        - text
        - slug
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim before validation/storage; 1–120 Unicode code points. No unique-title constraint.
        text:
          type: string
          maxLength: 10000
          description: Original text, never trimmed, normalized or rewritten. 0–10000 Unicode code points AND at most
            49152 UTF-8 bytes. Empty/whitespace drafts may be saved. Reject U+0000–U+0008, U+000B–U+001F and
            U+007F–U+009F; tab and LF allowed. Synthesis separately requires non-whitespace.
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        summary:
          type: string
          maxLength: 1000
          default: ""
        categoryId:
          type: string
          format: uuid
          nullable: true
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          uniqueItems: true
          default: []
        externalId:
          type: string
          minLength: 1
          maxLength: 200
    CmsImportCommitItem:
