              minimum: 1
              maximum: 10000
            filename:
              type: string
              description: Safe download filename, also supplied through Content-Disposition.
            createdAt:
              type: string
              format: date-time
          description: Only the last successfully committed audio is retained. contentRevision and ruleVersion identify
            the saved text and immutable personal snapshot actually synthesized. An audioId identifies exactly
            one set of bytes; replacement removes the previous ID. No history endpoint.
