        - categoryIds
        - expiresAt
        - revokedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CmsReadTokenCreated:
      type: object
      additionalProperties: false
