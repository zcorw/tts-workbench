        - categoryIds
        - expiresAt
        - token
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: Shown once. Short-lived read-only bearer; never accepted by draft/edit/TTS APIs. Store a SHA-256
            digest only.
    CmsReadTokenPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CmsReadToken"
    McpAuthorization:
      type: object
      additionalProperties: false
      properties:
        response_type:
          type: string
          enum:
            - code
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        resource:
          type: string
          format: uri
        scope:
          type: string
        state:
          type: string
          maxLength: 512
        code_challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        code_challenge_method:
          type: string
          enum:
            - S256
      required:
        - response_type
        - client_id
        - redirect_uri
