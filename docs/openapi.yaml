    get:
      operationId: cmsReadArticles
      summary: Read only current published releases
      description: Returns one consistent read snapshot of items/count and navigation. Navigation groups exact
        frozen leaf IDs across matching q/tag publications, ignoring the selected category and page.
        category=uncategorized selects null frozen membership; empty/unknown UUID categories return total0.
        Uses original release text/audio without truncation or mutation. Requires a current owner session or
        an unexpired/unrevoked CMS read bearer. Category scope is applied against frozen release membership.
        No anonymous access; bearer never grants draft or TTS access. Withdrawn/superseded releases are not
        available through this current-publication API; owners retain separate history access.
      security:
        - sessionCookie: []
        - cmsReadBearer: []
