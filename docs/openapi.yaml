  /v1/zhiyue/account/bindings/{id}:
    delete:
      operationId: zhiyueRevokeBinding
      summary: Revoke one 知阅 binding for the signed-in account
      description: Requires CMS_ZHIYUE_ENABLED=true (default false), the CMS listener and a configured HTTPS CMS
        origin. Uses the current browser session; mutations require the matching Origin and X-CSRF-Token.
        Revocation and ticket invalidation take effect immediately. A missing or unrelated binding is ignored.
      security:
