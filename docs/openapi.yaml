    get:
      operationId: getArticleAudio
      summary: Read exact current audio bytes by audioId
      description: "F2: authenticate owner and match both article ID and required audioId in one consistent read.
        Return404 NOT_FOUND for another owner, deleted/missing article, no audio or replaced audioId;
        missing/malformed audioId is400 INVALID_REQUEST. Read bytes/metadata from same row snapshot, so a
        concurrent replacement after read may finish delivering that already-selected audio consistently.
        Content-Type audio/mpeg, exact Content-Length, Content-Disposition with metadata filename, X-Audio-Id
        and X-Article-Content-Revision identify stored bytes; X-Pronunciation-Version is stored actual
        ruleVersion. Cache-Control no-store. No Range streaming guarantee; client loads complete response as
        Blob. Frontend may refetch article metadata after404 and retry GET with its new audioId at most once;
        never auto POST generation. Download stale audio remains allowed."
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: audioId
          in: query
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Complete saved MP3 corresponding exactly to required audioId. Max8388608 bytes, no history, no
            provider call.
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="speech.mp3"
            X-Pronunciation-Version:
              schema:
                type: integer
                minimum: 0
              description: Version of the personal snapshot actually used for this response, never a later DB lookup.
            X-Audio-Id:
              schema:
                type: string
                format: uuid
            X-Article-Content-Revision:
              schema:
                type: integer
                minimum: 1
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: "INVALID_REQUEST: invalid fields, JSON or unknown properties"
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: absent, invalid, expired or revoked session / invalid credentials"
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN / CSRF_INVALID / REGISTRATION_DISABLED
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: absent/not owned article, absent audio or audioId no longer matches. Same response
            for ownership failure; no historical audio access."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED; retry after indicated seconds
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
