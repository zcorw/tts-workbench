        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
          required: false
        - name: category
          in: query
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum:
                  - uncategorized
          required: false
          description: Exact frozen direct category ID, or uncategorized. No latest draft/tree lookup and no descendant
            expansion. Unknown/empty category IDs return an empty list.
