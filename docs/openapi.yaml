components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wb_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    cmsReadBearer:
      type: http
      scheme: bearer
      description: Only current published CMS reading endpoints. Short-lived, revocable and owner/category scoped;
        no draft/edit/synthesis access.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          example: REVISION_CONFLICT
        message:
          type: string
        requestId:
          type: string
          format: uuid
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - login
        - displayName
        - status
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
            - active
            - disabled
    Credentials:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^[A-Za-z0-9@._+-]+$
          description: Trimmed and lowercased; stable login identifier, not necessarily email.
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    Register:
      type: object
      additionalProperties: false
      required:
        - login
        - password
        - displayName
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^[A-Za-z0-9@._+-]+$
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    Csrf:
      type: object
      additionalProperties: false
      required:
        - csrfToken
        - expiresAt
      properties:
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    Config:
      type: object
      additionalProperties: false
      required:
        - registrationEnabled
        - language
        - maxVocabularyEntries
        - maxInputCodePoints
        - maxInputBytes
        - maxArticles
      properties:
        registrationEnabled:
          type: boolean
        language:
          type: string
          enum:
            - ja-JP
        maxVocabularyEntries:
          type: integer
          minimum: 1
        maxInputCodePoints:
          type: integer
          minimum: 1
        maxInputBytes:
          type: integer
          minimum: 1
        maxArticles:
          type: integer
          minimum: 1
          default: 100
          description: Maximum saved articles per account. Deployment MAX_ARTICLES defaults to 100; creation and
            capacity checks are atomic. Deletion releases a slot.
    VocabularyInput:
      type: object
      additionalProperties: false
      required:
        - text
        - reading
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
    VocabularyPatch:
      type: object
      additionalProperties: false
      required:
        - text
        - reading
        - expectedRevision
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        expectedRevision:
          type: integer
          minimum: 1
    Vocabulary:
      type: object
      additionalProperties: false
      required:
        - id
        - text
        - reading
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VocabularyResult:
      type: object
      additionalProperties: false
      required:
        - entry
        - internalVersion
      properties:
        entry:
          $ref: "#/components/schemas/Vocabulary"
        internalVersion:
          type: integer
          minimum: 0
    VocabularyPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - offset
        - limit
        - internalVersion
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vocabulary"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        internalVersion:
          type: integer
          minimum: 0
    Voice:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - language
        - provider
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: string
          enum:
            - ja-JP
        provider:
          type: string
          enum:
            - azure-speech
            - amazon-polly
    Voices:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Voice"
          description: Empty when no Japanese provider is configured; no demo voice is returned.
    Speech:
      type: object
      additionalProperties: false
      required:
        - input
        - voice
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 10000
          example: 今日は日本語を勉強します。
        voice:
          type: string
          minLength: 1
          description: ID from getVoices, not a provider voice identifier.
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          multipleOf: 0.01
          default: 1
        language:
          type: string
          enum:
            - ja-JP
          default: ja-JP
        inputType:
          type: string
          enum:
            - text
          default: text
        format:
          type: string
          enum:
            - mp3
          default: mp3
    Preview:
      type: object
      additionalProperties: false
      required:
        - text
        - reading
        - voice
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        reading:
          type: string
          minLength: 1
          maxLength: 100
          description: NFC normalized, non-whitespace; no angle brackets or control characters. Length in Unicode code
            points.
        voice:
          type: string
          minLength: 1
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          multipleOf: 0.01
          default: 1
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    AccountPatch:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    ArticleAudio:
      type: object
      additionalProperties: false
      required:
        - audioId
        - contentRevision
        - ruleVersion
        - voice
        - speed
        - language
        - format
        - mimeType
        - byteLength
        - characterCount
        - filename
        - createdAt
      properties:
        audioId:
          type: string
          format: uuid
        contentRevision:
          type: integer
          minimum: 1
        ruleVersion:
          type: integer
          minimum: 0
        voice:
          type: string
          minLength: 1
          description: Public voice alias actually used; never a credential or private provider configuration.
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          multipleOf: 0.01
          default: 1
        language:
          type: string
          enum:
            - ja-JP
        format:
          type: string
          enum:
            - mp3
        mimeType:
          type: string
          enum:
            - audio/mpeg
        byteLength:
          type: integer
          minimum: 1
          maximum: 8388608
        characterCount:
          type: integer
          minimum: 1
          maximum: 10000
        filename:
          type: string
          description: Safe download filename, also supplied through Content-Disposition.
        createdAt:
          type: string
          format: date-time
      description: Working article APIs retain the latest successful audio only. CMS releases separately retain
        selected immutable bytes, using the same actual content/rule/voice/speed metadata.
    ArticleSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - revision
        - contentRevision
        - createdAt
        - updatedAt
        - currentRuleVersion
        - audio
        - audioStale
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trim before validation/storage; 1–120 Unicode code points. No unique-title constraint.
        revision:
          type: integer
          minimum: 1
          description: Starts at 1. Increments exactly once when a successful PATCH changes trimmed title or exact text.
            No-op PATCH does not increment; generation does not increment. Required precondition for PATCH,
            DELETE and generation admission.
        contentRevision:
          type: integer
          minimum: 1
          description: Starts at 1, increments only when exact saved text changes. Title-only edits and generation do
            not change it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Time of last actual title/text update, initially createdAt. Generating audio does not reorder the
            article list.
        currentRuleVersion:
          type: integer
          minimum: 0
          description: Current personal rule-set version at response snapshot; not the historical version used for audio.
        audio:
          type: object
          additionalProperties: false
          required:
            - audioId
            - contentRevision
            - ruleVersion
            - voice
            - speed
            - language
            - format
            - mimeType
            - byteLength
            - characterCount
            - filename
            - createdAt
          properties:
            audioId:
              type: string
              format: uuid
            contentRevision:
              type: integer
              minimum: 1
            ruleVersion:
              type: integer
              minimum: 0
            voice:
